name: Fox-Tech
description: FOX-TECH CO. is a New Taipei City, Taiwan IoT company (founded 2016, backed by 500 Global
  and SparkLabs Taipei) that digitally transforms farming, logistics, cold-chain, and manufacturing
  operations. Its TempHawk platform pairs wireless temperature, humidity, CO2, light-intensity and
  soil-EC sensors over Sigfox LPWAN with web and mobile apps and cloud data analytics, helping the
  perishable-goods value chain monitor conditions, manage risk, and meet policy compliance. Recognized
  on the Forward Fooding FoodTech 500. No public API, developer portal, or SDK is currently published.
